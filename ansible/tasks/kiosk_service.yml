---
- name: /etc/camdisplay anlegen
  file:
    path: /etc/camdisplay
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: stream.env schreiben (enthaelt die Stream-URL/Zugangsdaten)
  template:
    src: stream.env.j2
    dest: /etc/camdisplay/stream.env
    owner: root
    group: root
    mode: '0600'
  register: camdisplay_stream_env

- name: systemd units kopieren
  template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - camdisplay.service
    - camdisplay-reboot.service
    - camdisplay-reboot-count-reset.service
    - camdisplay-reboot-count-reset.timer
  notify: daemon-reload
  register: camdisplay_units_copied

- meta: flush_handlers

- name: camdisplay-reboot-count-reset.timer aktivieren und starten
  systemd:
    name: camdisplay-reboot-count-reset.timer
    enabled: yes
    state: started

# "state: started" allein reicht nicht, um eine geaenderte Unit-Datei oder
# stream.env (z.B. neuer stream_url, oder wie hier: geaenderter User=) zu
# uebernehmen - dafuer braucht es einen echten Neustart. Deshalb hier explizit
# ermitteln, ob sich etwas geaendert hat, statt bei jedem install.yml-Lauf
# blind "started" zu setzen (das haette schon bei diesem allerersten
# User-Wechsel dazu gefuehrt, dass ffplay unbemerkt mit dem alten User
# weiterlief).
- name: Ermitteln, ob camdisplay.service neu gestartet werden muss
  set_fact:
    camdisplay_needs_restart: >-
      {{ camdisplay_stream_env is changed or
         (camdisplay_units_copied.results | selectattr('item', 'equalto', 'camdisplay.service') | map(attribute='changed') | first) }}

- name: camdisplay.service aktivieren und starten (neu starten falls Unit-Datei/stream.env sich geaendert haben)
  systemd:
    name: camdisplay.service
    enabled: yes
    state: "{{ 'restarted' if camdisplay_needs_restart else 'started' }}"
