---
# Manuelle Wartungsskripte fuer den Fall, dass gerade kein Ansible-Zugriff
# moeglich ist (z.B. vor Ort ohne Laptop/VPN). Der raspi-config-Overlay/
# Bootro-Mechanismus, den sie nutzen, ist derselbe wie in tasks/overlay.yml.

- name: /root/bin anlegen
  file:
    path: /root/bin
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Wartungsskripte nach /root/bin kopieren
  copy:
    src: "{{ item }}"
    dest: "/root/bin/{{ item }}"
    owner: root
    group: root
    mode: '0700'
  loop:
    - camdisplay-update.sh
    - camdisplay-writable.sh
    - camdisplay-reboot-guard.sh
    - camdisplay-reboot-count-reset.sh
    - camdisplay-screenshot.sh
