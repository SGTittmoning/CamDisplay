---
# en_US.UTF-8 fehlt auf frischen Raspberry Pi OS Lite Images oft komplett -
# fuehrt zu "setlocale: LC_ALL: cannot change locale"-Warnungen bei jedem
# SSH-Login/Ansible-Lauf (harmlos, aber unnoetiger Laerm). ansible.builtin
# hat kein eigenes locale_gen-Modul mehr (das wanderte nach community.general),
# deshalb hier bewusst ueber locale-gen/lineinfile direkt geloest, um ohne
# zusaetzliche Collection auszukommen.
- name: en_US.UTF-8 Locale aktivieren (/etc/locale.gen)
  lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*en_US\.UTF-8 UTF-8'
    line: 'en_US.UTF-8 UTF-8'
  register: camdisplay_locale_gen_conf

- name: Locale generieren
  command: locale-gen
  when: camdisplay_locale_gen_conf is changed

- name: LANG in /etc/default/locale setzen
  lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: 'LANG=en_US.UTF-8'
    create: yes

- name: LC_ALL in /etc/default/locale setzen
  lineinfile:
    path: /etc/default/locale
    regexp: '^LC_ALL='
    line: 'LC_ALL=en_US.UTF-8'
    create: yes

- name: apt-Cache aktualisieren (max. 1x pro Stunde)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  changed_when: false

- name: ffmpeg installieren (liefert ffplay)
  apt:
    name: ffmpeg
    state: present

- name: libegl1/libegl-mesa0 installieren (fuer kmsdrm/EGL, wird von ffmpeg nicht automatisch mitgezogen)
  apt:
    name:
      - libegl1
      - libegl-mesa0
    state: present

# kmsgrab (headless Screenshot fuer Tests, siehe camdisplay-screenshot.sh)
# ist Teil des ffmpeg-Pakets selbst - kein eigenes Paket noetig. Hier nur
# verifizieren, dass der aktuell installierte ffmpeg-Build es tatsaechlich
# mitbringt, damit ein fehlendes Feature sofort beim Deploy auffaellt statt
# erst beim naechsten Testversuch.
- name: kmsgrab-Unterstuetzung in ffmpeg pruefen
  command: ffmpeg -devices
  register: camdisplay_ffmpeg_devices
  changed_when: false

- name: Fehler falls kmsgrab fehlt
  assert:
    that:
      - "'kmsgrab' in camdisplay_ffmpeg_devices.stdout"
    fail_msg: "Dieser ffmpeg-Build unterstuetzt kmsgrab nicht - headless Screenshots (camdisplay-screenshot.sh) funktionieren so nicht."

- name: "{{ ansible_user }} in video/render Gruppen (fuer manuelles ffplay-Testen, KMS/DRM Zugriff)"
  user:
    name: "{{ ansible_user }}"
    groups: video,render
    append: yes

# Eigener, unprivilegierter System-User fuer camdisplay.service - bewusst
# NICHT der Ansible-Automatisierungsaccount ({{ ansible_user }}), der
# ueblicherweise passwortloses sudo hat. Ein kompromittierter ffplay-Prozess
# (z.B. durch eine Schwachstelle beim Dekodieren eines manipulierten Streams)
# haette so keinen direkten Weg zu Root - nur Zugriff auf /dev/dri ueber die
# video/render Gruppen, sonst nichts. Kein Login (nologin-Shell), kein
# Home-Verzeichnis noetig.
- name: Service-User "{{ camdisplay_service_user }}" fuer camdisplay.service anlegen
  user:
    name: "{{ camdisplay_service_user }}"
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    groups: video,render
    append: yes

# Optional, ueber die Inventory-Variable camdisplay_hostname gesteuert (fuer
# das Testgeraet i.d.R. nicht gesetzt). Wichtig fuer Netze, in denen der
# DHCP-Server per Hostname automatisch einen DNS-Eintrag anlegt (z.B.
# "camdisplay1.your-domain.lan") - eine DHCP-Reservierung allein (typischerweise
# MAC-basiert) sorgt nur fuer eine feste IP, nicht fuer die DNS-Aufloesung.
- name: Hostname setzen
  hostname:
    name: "{{ camdisplay_hostname }}"
  register: camdisplay_hostname_set
  when: camdisplay_hostname is defined

- name: /etc/hosts (127.0.1.1-Eintrag) an neuen Hostnamen anpassen
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ camdisplay_hostname }}"
    state: present
  when: camdisplay_hostname is defined

- name: Reboot fuer Hostname-Aenderung (neue DHCP-Anmeldung mit korrektem Hostnamen)
  reboot:
    msg: "Reboot nach Hostname-Aenderung"
  when: camdisplay_hostname_set is changed

- name: Zeitzone setzen
  timezone:
    name: "{{ camdisplay_timezone }}"

# Kiosk-Geraet, Kabelverbindung reicht - WLAN deaktivieren (weniger
# Verwirrung durch parallele DHCP-Adresse, kleinere Angriffsflaeche).
# Gleiches Vorgehen wie im alten CamDisplay-Ansible-Setup (dtoverlay=disable-wifi).
#
# Vorher: evtl. beim Imaging (z.B. Raspberry Pi Imager) versehentlich
# mitgegebene WLAN-Zugangsdaten entfernen - liegen sonst im Klartext in
# /etc/netplan/*.yaml.
- name: Vorhandene WLAN-Verbindungsprofile ermitteln
  command: nmcli -t -f NAME,TYPE connection show
  register: camdisplay_nm_connections
  changed_when: false

- name: WLAN-Verbindungsprofile (samt Zugangsdaten) entfernen
  command: "nmcli connection delete {{ item.split(':')[0] }}"
  loop: "{{ camdisplay_nm_connections.stdout_lines | select('search', ':802-11-wireless') | list }}"

- name: WLAN deaktivieren (dtoverlay, wirkt erst nach Reboot)
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: "^dtoverlay=disable-wifi"
    line: "dtoverlay=disable-wifi"
    insertafter: '^\[all\]'
  register: camdisplay_wifi_disabled

- name: Reboot fuer WLAN-Deaktivierung
  reboot:
    msg: "Reboot nach Deaktivierung von WLAN"
  when: camdisplay_wifi_disabled is changed
